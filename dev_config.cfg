; ─────────────────────────────────────────────────────────────
;  開發者測試設定（Developer test config）— 僅供開發／測試使用。
;  這個檔案由 DevConfig 於 res://dev_config.cfg 讀取。
;
;  grant_starter_pet:
;    true  → 新遊戲開始時贈送測試用初始寵物（兔子）。
;    false → 不贈送（正式行為）。
; ─────────────────────────────────────────────────────────────
;  dead_test_pets:
;    新遊戲時贈送幾隻「已死亡」的測試寵物（測水池復活與 U 面板顯示用）。
;    0 = 不贈送。
;  grant_all_gems:
;    true = 新遊戲一次贈送所有種類寶石各一顆（測試用）。
;
;  ★ test_mode 是總開關：設 false 就一次關閉以下所有測試功能（個別旗標仍可保留設定）。
;    正式發佈只要 test_mode=false，或乾脆不要把本檔打包進匯出即可（讀不到檔案 = 全關）。
[dev]
test_mode=false
grant_starter_pet=true
dead_test_pets=2
grant_all_gems=true
; true = 測試模式自動解鎖全部怪物卡片；false = 卡冊從空白開始。
grant_all_cards=false
